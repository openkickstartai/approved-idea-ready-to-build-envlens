[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "envlens"
version = "1.0.0"
description = "Full-stack environment variable contract consistency scanner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSL-1.1"}
authors = [{name = "EnvLens Team"}]
keywords = ["env", "environment-variables", "dotenv", "kubernetes", "docker", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
envlens = "envlens:main"

[project.urls]
Homepage = "https://github.com/envlens/envlens"
